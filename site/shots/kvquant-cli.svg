<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" rx="10" fill="#0e0e11"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#26262e" stroke-width="2"/>
  <rect width="800" height="38" rx="10" fill="#16161b"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#8b8b99" font-family="monospace" font-size="12">kvquant — 70b kv cache compression (8gb ram)</text>
  <text x="36" y="80" fill="#7fd1a0" font-family="monospace" font-size="14">$ kvquant --model Llama-3.3-70B --ctx 32768 --quant 2bit</text>
  <text x="36" y="112" fill="#ebe6db" font-family="monospace" font-size="13">Allocated 32k context KV-cache: 5.4 GB (standard baseline: 28.2 GB)</text>
  <text x="36" y="136" fill="#8fd0ee" font-family="monospace" font-size="13">Compression: 5.2x (2.1 bits/key-val)   Perplexity delta: +0.08</text>
  <rect x="36" y="168" width="728" height="246" rx="6" fill="#141418" stroke="#23232b"/>
  <polyline points="60,370 120,360 180,350 240,335 300,310 360,290 420,265 480,240 540,215 600,190 660,175 720,165" fill="none" stroke="#7fd1a0" stroke-width="2.5"/>
  <polyline points="60,380 120,350 180,320 240,280 300,230 360,180 420,130 480,90 540,50 600,30 660,10 720,5" fill="none" stroke="#ff5f56" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="60" y="398" fill="#7a766a" font-family="monospace" font-size="11">Green: KVQuant (Bounded 5.4GB)   Red: Unquantized (OOM Cliff at 8k tokens)</text>
</svg>
