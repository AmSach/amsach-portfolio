<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shell -->
  <rect width="800" height="460" rx="10" fill="url(#termGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2638" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect width="800" height="38" rx="10" fill="#131826"/>
  <rect x="0" y="37" width="800" height="1" fill="#1e2638"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#7a889b" font-family="monospace" font-size="12" letter-spacing="0.5">latency-engine — c++20 lock-free order book stat-arb</text>

  <!-- Command Prompt Strip -->
  <rect x="28" y="50" width="744" height="32" rx="5" fill="#0b0e14" stroke="#192231"/>
  <text x="40" y="71" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">$ <tspan fill="#e2e8f0" font-weight="normal">./bin/latency_engine --stat-arb --venues binance,coinbase --pin-core 3</tspan></text>

  <!-- Left Sidebar Pane -->
  <rect x="28" y="92" width="224" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="28" y="92" width="224" height="28" rx="6" fill="#111622"/>
  <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">HFT ORDER BOOK TELEMETRY</text>
    <text x="44" y="120" fill="#4ade80" font-family="monospace" font-size="12">Throughput: <tspan fill="#f1f5f9">2,400,000 ticks/sec</tspan></text>
    <text x="44" y="146" fill="#38bdf8" font-family="monospace" font-size="12">Tick-to-Trade p50: <tspan fill="#f1f5f9">420 ns</tspan></text>
    <text x="44" y="172" fill="#4ade80" font-family="monospace" font-size="12">Tick-to-Trade p95: <tspan fill="#f1f5f9">780 ns</tspan></text>
    <text x="44" y="198" fill="#fbbf24" font-family="monospace" font-size="12">Tick-to-Trade p99: <tspan fill="#f1f5f9">1.12 µs</tspan></text>
    <text x="44" y="224" fill="#94a3b8" font-family="monospace" font-size="12">Ring Buffer: <tspan fill="#f1f5f9">Lock-Free SPSC</tspan></text>
    <text x="44" y="250" fill="#4ade80" font-family="monospace" font-size="12">Allocations Hot: <tspan fill="#f1f5f9">0 bytes (Zero-Copy)</tspan></text>
    <text x="44" y="276" fill="#38bdf8" font-family="monospace" font-size="12">Cross-Ven Spread: <tspan fill="#f1f5f9">+14.2 bps</tspan></text>
    <text x="44" y="302" fill="#4ade80" font-family="monospace" font-size="12">Delta Exposure: <tspan fill="#f1f5f9">0.00 (Delta-Neutral)</tspan></text>
    <text x="44" y="328" fill="#a78bfa" font-family="monospace" font-size="12">Core Pinning: <tspan fill="#f1f5f9">CPU 3 (isolcpus)</tspan></text>

  <!-- Right Visual / Graph Pane -->
  <rect x="264" y="92" width="508" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="264" y="92" width="508" height="28" rx="6" fill="#111622"/>
  <text x="278" y="110" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">NANOSECOND TICK LATENCY &amp; CROSS-VENUE SPREAD</text>
  
  <!-- Right Content Injected -->
  <!-- Sparkline Waveform -->
  <line x1="285" y1="240" x2="745" y2="240" stroke="#161e2e"/>
  <polyline points="290,260 330,250 370,270 410,210 450,230 490,180 530,195 570,165 610,185 650,150 690,170 735,145" fill="none" stroke="url(#emeraldLine)" stroke-width="3"/>
  <polyline points="290,290 330,285 370,280 410,265 450,260 490,245 530,248 570,230 610,235 650,215 690,220 735,205" fill="none" stroke="url(#goldLine)" stroke-width="2" stroke-dasharray="5,4"/>

  <text x="290" y="145" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">Spread Waveform: +14.2 bps</text>
  <text x="600" y="320" fill="#64748b" font-family="monospace" font-size="10">p50: 420ns · p95: 780ns</text>
  <rect x="290" y="335" width="445" height="24" rx="3" fill="#131926"/>
  <text x="300" y="351" fill="#38bdf8" font-family="monospace" font-size="11">Order Depth: Bids 14.8M | Asks 15.2M | Spread Arbitrage Locked</text>

  <!-- Status Bar Footer in Right Pane -->
  <rect x="278" y="380" width="480" height="36" rx="4" fill="#0e131d" stroke="#192231"/>
  <text x="292" y="398" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">✓ Lock-free ring buffer healthy · Zero memory allocations in hot path</text>
  <text x="292" y="411" fill="#64748b" font-family="monospace" font-size="10">C++20 modular engine · Linux epoll/kernel-bypass · Delta-neutral funding</text>
</svg>