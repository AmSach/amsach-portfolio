  <circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="26" r="6" fill="#27c93f"/>

  <!-- Main Title & Subtitle -->
  <text x="96" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">KVQuant // 70-Billion Parameter Attention Memory Compressor</text>
  <text x="96" y="42" fill="#64748b" font-family="monospace" font-size="11">Non-Uniform 2-Bit Key-Value Cache Quantization for Consumer Hardware</text>

