  <text x="554" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">REASONING ACCURACY REGRESSION</text>
  <text x="554" y="118" fill="#fbbf24" font-family="monospace" font-size="20" font-weight="bold">+0.04 PPL</text>
  <text x="554" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Virtually Identical to Full-Precision AI</text>

