<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shell -->
  <rect width="800" height="460" rx="10" fill="url(#termGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2638" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect width="800" height="38" rx="10" fill="#131826"/>
  <rect x="0" y="37" width="800" height="1" fill="#1e2638"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#7a889b" font-family="monospace" font-size="12" letter-spacing="0.5">kvquant — 70b kv cache compression benchmark</text>

  <!-- Command Prompt Strip -->
  <rect x="28" y="50" width="744" height="32" rx="5" fill="#0b0e14" stroke="#192231"/>
  <text x="40" y="71" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">$ <tspan fill="#e2e8f0" font-weight="normal">python -m kvquant.eval --model llama-3-70b-instruct --context 32768</tspan></text>

  <!-- Left Sidebar Pane -->
  <rect x="28" y="92" width="224" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="28" y="92" width="224" height="28" rx="6" fill="#111622"/>
  <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">ATTENTION CACHE PROFILE</text>
    <text x="44" y="120" fill="#38bdf8" font-family="monospace" font-size="12">Target Model: <tspan fill="#f1f5f9">Llama-3 70B (32k)</tspan></text>
    <text x="44" y="146" fill="#f87171" font-family="monospace" font-size="12">Base KV (FP16): <tspan fill="#f1f5f9">28.2 GB (OOM Crash)</tspan></text>
    <text x="44" y="172" fill="#4ade80" font-family="monospace" font-size="12">KVQuant (2-bit): <tspan fill="#f1f5f9">4.1 GB (Fits 8GB)</tspan></text>
    <text x="44" y="198" fill="#4ade80" font-family="monospace" font-size="12">Compression: <tspan fill="#f1f5f9">6.8x Memory Cut</tspan></text>
    <text x="44" y="224" fill="#38bdf8" font-family="monospace" font-size="12">Perplexity Delta: <tspan fill="#f1f5f9">+0.04 (Wikitext-2)</tspan></text>
    <text x="44" y="250" fill="#4ade80" font-family="monospace" font-size="12">Decoding Speed: <tspan fill="#f1f5f9">2.1x Acceleration</tspan></text>
    <text x="44" y="276" fill="#fbbf24" font-family="monospace" font-size="12">Outlier Channels: <tspan fill="#f1f5f9">Preserved FP16</tspan></text>
    <text x="44" y="302" fill="#a78bfa" font-family="monospace" font-size="12">SIMD Vector: <tspan fill="#f1f5f9">AVX-512 / Metal</tspan></text>
    <text x="44" y="328" fill="#94a3b8" font-family="monospace" font-size="12">Hardware Target: <tspan fill="#f1f5f9">M-Series &amp; 8GB RAM</tspan></text>

  <!-- Right Visual / Graph Pane -->
  <rect x="264" y="92" width="508" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="264" y="92" width="508" height="28" rx="6" fill="#111622"/>
  <text x="278" y="110" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">MEMORY SCALING ACROSS CONTEXT WINDOW (32K TOKENS)</text>
  
  <!-- Right Content Injected -->
  <!-- Graph -->
  <line x1="290" y1="330" x2="745" y2="330" stroke="#2a3447"/>
  
  <!-- Base FP16 OOM Cliff -->
  <polyline points="310,300 400,240 480,180 560,130" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="570" y="135" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">28.2 GB (OOM Cliff)</text>

  <!-- KVQuant Bounded Line -->
  <polyline points="310,315 400,310 480,305 560,300 640,296 720,292" fill="none" stroke="url(#emeraldLine)" stroke-width="3"/>
  <circle cx="720" cy="292" r="5" fill="#4ade80"/>
  <text x="620" y="280" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">KVQuant: 4.1 GB (Flat)</text>

  <rect x="290" y="165" width="220" height="42" rx="4" fill="#131926" stroke="#1e2638"/>
  <text x="300" y="182" fill="#fbbf24" font-family="monospace" font-size="10">Non-Uniform Quantization</text>
  <text x="300" y="198" fill="#94a3b8" font-family="monospace" font-size="9">Preserves outlier attention heads</text>

  <!-- Status Bar Footer in Right Pane -->
  <rect x="278" y="380" width="480" height="36" rx="4" fill="#0e131d" stroke="#192231"/>
  <text x="292" y="398" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">✓ Attention kernel vectorized via SIMD · 0 accuracy regression</text>
  <text x="292" y="411" fill="#64748b" font-family="monospace" font-size="10">Drop-in KV cache compressor · 70B inference on consumer laptops · Zero retraining</text>
</svg>