  <text x="42" y="118" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">28.2 GB ➔ 4.1 GB</text>
  <text x="42" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">6.8x Massive Memory Reduction</text>

  <!-- Card 2 -->
  <rect x="282" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="298" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">HARDWARE REQUIRED</text>
  <text x="298" y="118" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold">8 GB RAM Laptop</text>
  <text x="298" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Unlocks 70B Models on Everyday PCs</text>

  <!-- Card 3 -->
