  <text x="42" y="118" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">48 Pages / sec</text>
  <text x="42" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Processes Complete Books &amp; Annual Reports</text>

  <!-- Card 2 -->
  <rect x="282" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="298" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">CHARACTER ACCURACY</text>
  <text x="298" y="118" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold">99.4% Recall</text>
  <text x="298" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Extracts Tables, Columns &amp; Bounding Boxes</text>

  <!-- Card 3 -->
  <rect x="538" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="554" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">NETWORK CALLS MADE</text>
