    <text x="44" y="276" fill="#4ade80" font-family="monospace" font-size="12">Memory Peak: <tspan fill="#f1f5f9">410 MB RSS</tspan></text>
    <text x="44" y="302" fill="#fbbf24" font-family="monospace" font-size="12">Export Formats: <tspan fill="#f1f5f9">Markdown, JSON, CSV</tspan></text>
    <text x="44" y="328" fill="#38bdf8" font-family="monospace" font-size="12">Privacy Status: <tspan fill="#f1f5f9">Air-Gapped Sovereign</tspan></text>

