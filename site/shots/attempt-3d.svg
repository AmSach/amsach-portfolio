<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e121a"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame Background -->
  <rect width="800" height="460" rx="10" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2738" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect width="800" height="52" rx="10" fill="#131926"/>
  <rect x="0" y="51" width="800" height="1" fill="#1e2738"/>
  
  <!-- Terminal Dot Controls -->
  <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="26" r="6" fill="#27c93f"/>

  <!-- Main Title & Subtitle -->
  <text x="96" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">Attempt 3D // From-Scratch Pure C++ 3D Game Engine</text>
  <text x="96" y="42" fill="#64748b" font-family="monospace" font-size="11">398KB Executable with Software Rasterizer, 3D Math &amp; Zombie FPS</text>

  <!-- Top Right Verified Badge -->
  <rect x="580" y="14" width="194" height="24" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="594" cy="26" r="4" fill="#fbbf24"/>
  <text x="606" y="30" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">398KB BINARY · ZERO LIBS</text>

  <!-- Top 3 Stat Summary Cards -->
  <!-- Card 1 -->
  <rect x="26" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="42" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">EXECUTABLE SIZE</text>
  <text x="42" y="118" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">398 Kilobytes</text>
  <text x="42" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Smaller than a Single Photo</text>

  <!-- Card 2 -->
  <rect x="282" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="298" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">RENDER PERFORMANCE</text>
  <text x="298" y="118" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold">60 FPS Locked</text>
  <text x="298" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Pure CPU Software Rasterizer (No GPU needed)</text>

  <!-- Card 3 -->
  <rect x="538" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="554" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">EXTERNAL DEPENDENCIES</text>
  <text x="554" y="118" fill="#fbbf24" font-family="monospace" font-size="20" font-weight="bold">0 Frameworks</text>
  <text x="554" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Built Entirely from Scratch in Pure C++</text>

  <!-- Center Visual Display Area -->
  <rect x="26" y="160" width="748" height="226" rx="8" fill="#0b0e14" stroke="#192231"/>
  <text x="50" y="195" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Pure CPU Software Rasterization & 3D Math</text>
  
  <!-- 3D Cube Wireframe -->
  <polygon points="180,240 280,260 280,340 180,320" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="280,260 360,230 360,310 280,340" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="180,240 260,210 360,230 280,260" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

  <text x="70" y="355" fill="#94a3b8" font-family="monospace" font-size="11">Vertex Transform: 1.8ms · Raster: 8.4ms · Frame: 10.2ms</text>

  <!-- Divider -->
  <line x1="495" y1="180" x2="495" y2="365" stroke="#1e293b"/>

  <rect x="515" y="225" width="230" height="52" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="528" y="244" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Custom 3D Math Pipeline</text>
  <text x="528" y="260" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Matrices, vectors, perspective clipping, and Z-buffer</text>

  <rect x="515" y="288" width="230" height="52" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="528" y="307" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Playable Zombie FPS Game</text>
  <text x="528" y="323" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Enemy AI, collision detection, and raycast shooting</text>

  <!-- Bottom Takeaway Banner -->
  <rect x="26" y="396" width="748" height="48" rx="6" fill="#0d1420" stroke="#1d283a"/>
  <circle cx="48" cy="420" r="10" fill="#10b981" opacity="0.2"/>
  <path d="M 44,420 L 47,423 L 52,417" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="68" y="416" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">The Plain-English Impact</text>
  <text x="68" y="432" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Demonstrates deep low-level computer science mastery: building an entire 3D graphics pipeline and playable game from zero external code in a 398KB file.</text>
</svg>