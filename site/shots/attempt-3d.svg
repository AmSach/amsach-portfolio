<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shell -->
  <rect width="800" height="460" rx="10" fill="url(#termGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2638" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect width="800" height="38" rx="10" fill="#131826"/>
  <rect x="0" y="37" width="800" height="1" fill="#1e2638"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#7a889b" font-family="monospace" font-size="12" letter-spacing="0.5">attempt-3d-engine — pure c++ software rasterizer (400kb)</text>

  <!-- Command Prompt Strip -->
  <rect x="28" y="50" width="744" height="32" rx="5" fill="#0b0e14" stroke="#192231"/>
  <text x="40" y="71" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">$ <tspan fill="#e2e8f0" font-weight="normal">./attempt3d --render-target software-fb --resolution 640x480 --lock-60fps</tspan></text>

  <!-- Left Sidebar Pane -->
  <rect x="28" y="92" width="224" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="28" y="92" width="224" height="28" rx="6" fill="#111622"/>
  <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">3D RASTERIZER SPECS</text>
    <text x="44" y="120" fill="#4ade80" font-family="monospace" font-size="12">Binary Footprint: <tspan fill="#f1f5f9">398 KB Executable</tspan></text>
    <text x="44" y="146" fill="#4ade80" font-family="monospace" font-size="12">Dependencies: <tspan fill="#f1f5f9">0 (Pure C++ / Win32)</tspan></text>
    <text x="44" y="172" fill="#38bdf8" font-family="monospace" font-size="12">Pipeline: <tspan fill="#f1f5f9">Software Z-Buffer</tspan></text>
    <text x="44" y="198" fill="#94a3b8" font-family="monospace" font-size="12">Transforms: <tspan fill="#f1f5f9">Homogeneous 4x4</tspan></text>
    <text x="44" y="224" fill="#38bdf8" font-family="monospace" font-size="12">Rasterization: <tspan fill="#f1f5f9">Barycentric Fixed-Pt</tspan></text>
    <text x="44" y="250" fill="#4ade80" font-family="monospace" font-size="12">Framerate: <tspan fill="#f1f5f9">60 FPS Locked (CPU)</tspan></text>
    <text x="44" y="276" fill="#fbbf24" font-family="monospace" font-size="12">Shading: <tspan fill="#f1f5f9">Gouraud + Directional</tspan></text>
    <text x="44" y="302" fill="#94a3b8" font-family="monospace" font-size="12">BSP Trees: <tspan fill="#f1f5f9">Active Occlusion</tspan></text>
    <text x="44" y="328" fill="#a78bfa" font-family="monospace" font-size="12">Game Systems: <tspan fill="#f1f5f9">Zombie FPS Gameplay</tspan></text>

  <!-- Right Visual / Graph Pane -->
  <rect x="264" y="92" width="508" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="264" y="92" width="508" height="28" rx="6" fill="#111622"/>
  <text x="278" y="110" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">REAL-TIME CPU WIREFRAME MESH PROJECTION</text>
  
  <!-- Right Content Injected -->
  <!-- 3D Wireframe Wire Cube / Mesh -->
  <polygon points="460,150 560,170 560,270 460,250" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="560,170 640,140 640,240 560,270" fill="none" stroke="#4ade80" stroke-width="2"/>
  <polygon points="460,150 540,120 640,140 560,170" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <line x1="460" y1="250" x2="540" y2="220" stroke="#38bdf8" stroke-dasharray="3,3"/>
  <line x1="540" y1="120" x2="540" y2="220" stroke="#a78bfa" stroke-dasharray="3,3"/>
  <line x1="640" y1="240" x2="540" y2="220" stroke="#4ade80" stroke-dasharray="3,3"/>

  <text x="310" y="325" fill="#38bdf8" font-family="monospace" font-size="11">Vertex Transform: 1.8ms | Raster: 8.4ms | Frame: 10.2ms</text>

  <!-- Status Bar Footer in Right Pane -->
  <rect x="278" y="380" width="480" height="36" rx="4" fill="#0e131d" stroke="#192231"/>
  <text x="292" y="398" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">✓ Zero runtime dependencies · Pure Win32/X11 framebuffer blit</text>
  <text x="292" y="411" fill="#64748b" font-family="monospace" font-size="10">From-scratch 3D game engine &amp; zombie FPS in pure C++ · Custom software renderer</text>
</svg>