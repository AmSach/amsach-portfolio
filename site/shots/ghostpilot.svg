<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shell -->
  <rect width="800" height="460" rx="10" fill="url(#termGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2638" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect width="800" height="38" rx="10" fill="#131826"/>
  <rect x="0" y="37" width="800" height="1" fill="#1e2638"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#7a889b" font-family="monospace" font-size="12" letter-spacing="0.5">ghostpilot — gps-denied uav autonomy hud</text>

  <!-- Command Prompt Strip -->
  <rect x="28" y="50" width="744" height="32" rx="5" fill="#0b0e14" stroke="#192231"/>
  <text x="40" y="71" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">$ <tspan fill="#e2e8f0" font-weight="normal">ros2 launch ghostpilot mission_vins.launch.py --mission &quot;corridor_recon_b&quot;</tspan></text>

  <!-- Left Sidebar Pane -->
  <rect x="28" y="92" width="224" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="28" y="92" width="224" height="28" rx="6" fill="#111622"/>
  <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">UAV MISSION TELEMETRY</text>
    <text x="44" y="120" fill="#f87171" font-family="monospace" font-size="12">GNSS Fix: <tspan fill="#f1f5f9">NO FIX (GPS-Denied)</tspan></text>
    <text x="44" y="146" fill="#4ade80" font-family="monospace" font-size="12">State Estimator: <tspan fill="#f1f5f9">VINS-Mono VIO</tspan></text>
    <text x="44" y="172" fill="#4ade80" font-family="monospace" font-size="12">Optical Flow: <tspan fill="#f1f5f9">LOCKED (120 FPS)</tspan></text>
    <text x="44" y="198" fill="#38bdf8" font-family="monospace" font-size="12">Altitude AGL: <tspan fill="#f1f5f9">2.45 m ± 0.02m</tspan></text>
    <text x="44" y="224" fill="#94a3b8" font-family="monospace" font-size="12">Velocity Vector: <tspan fill="#f1f5f9">[1.2, 0.4, 0.0] m/s</tspan></text>
    <text x="44" y="250" fill="#4ade80" font-family="monospace" font-size="12">Trajectory Drift: <tspan fill="#f1f5f9">&lt; 0.8% of path</tspan></text>
    <text x="44" y="276" fill="#a78bfa" font-family="monospace" font-size="12">Agentic Mission: <tspan fill="#f1f5f9">Waypoint Seq #4</tspan></text>
    <text x="44" y="302" fill="#38bdf8" font-family="monospace" font-size="12">Obstacle Avoid: <tspan fill="#f1f5f9">Dynamic 3D Octree</tspan></text>
    <text x="44" y="328" fill="#fbbf24" font-family="monospace" font-size="12">Failsafe Buffer: <tspan fill="#f1f5f9">Autonomous Hover</tspan></text>

  <!-- Right Visual / Graph Pane -->
  <rect x="264" y="92" width="508" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="264" y="92" width="508" height="28" rx="6" fill="#111622"/>
  <text x="278" y="110" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">3D VIO TRAJECTORY &amp; SLAM ESTIMATION</text>
  
  <!-- Right Content Injected -->
  <!-- Grid & Path -->
  <line x1="290" y1="230" x2="745" y2="230" stroke="#161e2e" stroke-dasharray="4,4"/>
  <path d="M 310,280 C 370,160 440,300 520,180 S 640,240 720,150" fill="none" stroke="url(#cyanLine)" stroke-width="3"/>
  <circle cx="720" cy="150" r="6" fill="#4ade80"/>
  <text x="630" y="140" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">UAV Position</text>

  <!-- Obstacle Clusters -->
  <rect x="420" y="190" width="24" height="24" rx="4" fill="#f87171" opacity="0.6"/>
  <text x="415" y="180" fill="#f87171" font-family="monospace" font-size="9">Obstacle</text>
  <rect x="560" y="210" width="28" height="28" rx="4" fill="#f87171" opacity="0.6"/>

  <text x="310" y="320" fill="#94a3b8" font-family="monospace" font-size="10">Planned: [A-01 -> B-04 -> C-08] · Collision Margin: 1.4m</text>

  <!-- Status Bar Footer in Right Pane -->
  <rect x="278" y="380" width="480" height="36" rx="4" fill="#0e131d" stroke="#192231"/>
  <text x="292" y="398" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">✓ Real-time waypoint tracking active · Collision avoidance 100% nominal</text>
  <text x="292" y="411" fill="#64748b" font-family="monospace" font-size="10">VINS-Mono visual inertial odometry · Nav2 LLM waypoint parser · PX4 flight stack</text>
</svg>