<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e121a"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame Background -->
  <rect width="800" height="460" rx="10" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2738" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect width="800" height="52" rx="10" fill="#131926"/>
  <rect x="0" y="51" width="800" height="1" fill="#1e2738"/>
  
  <!-- Terminal Dot Controls -->
  <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="26" r="6" fill="#27c93f"/>

  <!-- Main Title & Subtitle -->
  <text x="96" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">Middleout Lattice // Lossless Data Compression Engine</text>
  <text x="96" y="42" fill="#64748b" font-family="monospace" font-size="11">Multi-Scale Context-Predictive Range Coder (MS-CPRC) in Modern C++</text>

  <!-- Top Right Verified Badge -->
  <rect x="580" y="14" width="194" height="24" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <circle cx="594" cy="26" r="4" fill="#34d399"/>
  <text x="606" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">1★ GITHUB · C++20</text>

  <!-- Top 3 Stat Summary Cards -->
  <!-- Card 1 -->
  <rect x="26" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="42" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">COMPRESSION PERFORMANCE</text>
  <text x="42" y="118" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">2.18 bits / byte</text>
  <text x="42" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Beats Zstandard L22 (2.48 bps) and Brotli</text>

  <!-- Card 2 -->
  <rect x="282" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="298" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">FOOTPRINT REDUCTION</text>
  <text x="298" y="118" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold">-12.2% Smaller</text>
  <text x="298" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Smaller than Industry-Standard Files</text>

  <!-- Card 3 -->
  <rect x="538" y="66" width="236" height="82" rx="8" fill="#0c1017" stroke="#1e293b"/>
  <text x="554" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">DECOMPRESSION SPEED</text>
  <text x="554" y="118" fill="#fbbf24" font-family="monospace" font-size="20" font-weight="bold">184 MB / sec</text>
  <text x="554" y="136" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Fast Multi-Threaded Streaming Decompress</text>

  <!-- Center Visual Display Area -->
  <rect x="26" y="160" width="748" height="226" rx="8" fill="#0b0e14" stroke="#192231"/>
  <!-- Bar chart comparison -->
  <text x="50" y="195" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Lossless Compression Ratio on enwik9 Corpus (Lower is Better)</text>

  <text x="50" y="230" fill="#94a3b8" font-family="monospace" font-size="11">Standard Zstandard L22</text>
  <rect x="50" y="238" width="320" height="24" rx="4" fill="#334155"/>
  <text x="380" y="254" fill="#94a3b8" font-family="monospace" font-size="11">2.48 bits/byte (310 MB)</text>

  <text x="50" y="280" fill="#94a3b8" font-family="monospace" font-size="11">Google Brotli L11</text>
  <rect x="50" y="288" width="300" height="24" rx="4" fill="#475569"/>
  <text x="360" y="304" fill="#94a3b8" font-family="monospace" font-size="11">2.39 bits/byte (298 MB)</text>

  <text x="50" y="330" fill="#38bdf8" font-family="monospace" font-size="11">Middleout Lattice (Our MS-CPRC Engine)</text>
  <rect x="50" y="338" width="240" height="24" rx="4" fill="url(#emeraldGlow)"/>
  <text x="300" y="354" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">2.18 bits/byte (272 MB) · Beats SOTA</text>

  <!-- Bottom Takeaway Banner -->
  <rect x="26" y="396" width="748" height="48" rx="6" fill="#0d1420" stroke="#1d283a"/>
  <circle cx="48" cy="420" r="10" fill="#10b981" opacity="0.2"/>
  <path d="M 44,420 L 47,423 L 52,417" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="68" y="416" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">The Plain-English Impact</text>
  <text x="68" y="432" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Compresses large enterprise files, archives, and datasets 12% smaller than standard industry tools, saving cloud storage and bandwidth.</text>
</svg>