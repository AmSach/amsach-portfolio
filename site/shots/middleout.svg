<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shell -->
  <rect width="800" height="460" rx="10" fill="url(#termGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2638" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect width="800" height="38" rx="10" fill="#131826"/>
  <rect x="0" y="37" width="800" height="1" fill="#1e2638"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#7a889b" font-family="monospace" font-size="12" letter-spacing="0.5">middleout-lattice — ms-cprc entropy coder benchmark</text>

  <!-- Command Prompt Strip -->
  <rect x="28" y="50" width="744" height="32" rx="5" fill="#0b0e14" stroke="#192231"/>
  <text x="40" y="71" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">$ <tspan fill="#e2e8f0" font-weight="normal">./bin/middleout -c enwik9.raw --predictor multi-scale-context --level ultra</tspan></text>

  <!-- Left Sidebar Pane -->
  <rect x="28" y="92" width="224" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="28" y="92" width="224" height="28" rx="6" fill="#111622"/>
  <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">LOSSLESS RATIO BENCHMARK</text>
    <text x="44" y="120" fill="#38bdf8" font-family="monospace" font-size="12">Corpus: <tspan fill="#f1f5f9">enwik9 (1.00 GB)</tspan></text>
    <text x="44" y="146" fill="#94a3b8" font-family="monospace" font-size="12">Zstd L22: <tspan fill="#f1f5f9">2.48 bps (310 MB)</tspan></text>
    <text x="44" y="172" fill="#94a3b8" font-family="monospace" font-size="12">Brotli L11: <tspan fill="#f1f5f9">2.39 bps (298 MB)</tspan></text>
    <text x="44" y="198" fill="#4ade80" font-family="monospace" font-size="12">MS-CPRC (Ours): <tspan fill="#f1f5f9">2.18 bps (272 MB)</tspan></text>
    <text x="44" y="224" fill="#4ade80" font-family="monospace" font-size="12">Margin over Zstd: <tspan fill="#f1f5f9">-12.2% Footprint</tspan></text>
    <text x="44" y="250" fill="#38bdf8" font-family="monospace" font-size="12">Decompress Rate: <tspan fill="#f1f5f9">184 MB/sec</tspan></text>
    <text x="44" y="276" fill="#94a3b8" font-family="monospace" font-size="12">Context Window: <tspan fill="#f1f5f9">32 MB Ring Buffer</tspan></text>
    <text x="44" y="302" fill="#fbbf24" font-family="monospace" font-size="12">Range Coder: <tspan fill="#f1f5f9">Carry-Free 64-bit</tspan></text>
    <text x="44" y="328" fill="#4ade80" font-family="monospace" font-size="12">Validation: <tspan fill="#f1f5f9">Bit-Identical (CRC32)</tspan></text>

  <!-- Right Visual / Graph Pane -->
  <rect x="264" y="92" width="508" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="264" y="92" width="508" height="28" rx="6" fill="#111622"/>
  <text x="278" y="110" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">PARETO COMPRESSION RATIO VS SPEED FRONTIER</text>
  
  <!-- Right Content Injected -->
  <!-- Pareto Frontier Plot -->
  <line x1="290" y1="330" x2="745" y2="330" stroke="#2a3447"/>
  <line x1="290" y1="130" x2="290" y2="330" stroke="#2a3447"/>
  
  <!-- Competitor Points -->
  <circle cx="420" cy="240" r="5" fill="#94a3b8"/>
  <text x="430" y="244" fill="#94a3b8" font-family="monospace" font-size="10">Zstd L22 (2.48 bps)</text>

  <circle cx="510" cy="210" r="5" fill="#818cf8"/>
  <text x="520" y="214" fill="#818cf8" font-family="monospace" font-size="10">Brotli L11 (2.39 bps)</text>

  <!-- Middleout Point -->
  <circle cx="620" cy="160" r="7" fill="#4ade80"/>
  <text x="632" y="164" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">MS-CPRC (2.18 bps)</text>
  <text x="632" y="178" fill="#38bdf8" font-family="monospace" font-size="10">BEATS SOTA BY 8.8%</text>

  <rect x="300" y="150" width="180" height="40" rx="4" fill="#131926"/>
  <text x="310" y="168" fill="#fbbf24" font-family="monospace" font-size="10">Multi-Scale Predictive</text>
  <text x="310" y="182" fill="#64748b" font-family="monospace" font-size="9">Dynamic Markov transition</text>

  <!-- Status Bar Footer in Right Pane -->
  <rect x="278" y="380" width="480" height="36" rx="4" fill="#0e131d" stroke="#192231"/>
  <text x="292" y="398" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">✓ Lossless bit-identical roundtrip verified on Silesia &amp; Calgary corpora</text>
  <text x="292" y="411" fill="#64748b" font-family="monospace" font-size="10">Pure C++ MS-CPRC range coder · Zero external dependencies · High-density entropy engine</text>
</svg>