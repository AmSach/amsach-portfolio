<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shell -->
  <rect width="800" height="460" rx="10" fill="url(#termGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="9" fill="none" stroke="#1e2638" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect width="800" height="38" rx="10" fill="#131826"/>
  <rect x="0" y="37" width="800" height="1" fill="#1e2638"/>
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" fill="#7a889b" font-family="monospace" font-size="12" letter-spacing="0.5">iit-bombay — techfest autonomous robotics runner-up</text>

  <!-- Command Prompt Strip -->
  <rect x="28" y="50" width="744" height="32" rx="5" fill="#0b0e14" stroke="#192231"/>
  <text x="40" y="71" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">$ <tspan fill="#e2e8f0" font-weight="normal">ros2 launch rover_autonomy arena_navigation.launch.py --obstacles dynamic</tspan></text>

  <!-- Left Sidebar Pane -->
  <rect x="28" y="92" width="224" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="28" y="92" width="224" height="28" rx="6" fill="#111622"/>
  <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">ARENA HARDWARE RUNNER-UP</text>
    <text x="44" y="120" fill="#38bdf8" font-family="monospace" font-size="12">Competition: <tspan fill="#f1f5f9">IIT Bombay Techfest</tspan></text>
    <text x="44" y="146" fill="#fbbf24" font-family="monospace" font-size="12">Rank: <tspan fill="#f1f5f9">National Runner-up</tspan></text>
    <text x="44" y="172" fill="#4ade80" font-family="monospace" font-size="12">Platform: <tspan fill="#f1f5f9">Custom 6x6 Ground Rover</tspan></text>
    <text x="44" y="198" fill="#38bdf8" font-family="monospace" font-size="12">Sensors: <tspan fill="#f1f5f9">3D LiDAR, Depth, CAN</tspan></text>
    <text x="44" y="224" fill="#94a3b8" font-family="monospace" font-size="12">Actuation: <tspan fill="#f1f5f9">High-Torque BLDC</tspan></text>
    <text x="44" y="250" fill="#fbbf24" font-family="monospace" font-size="12">Obstacle Course: <tspan fill="#f1f5f9">Rubble, Inclines, Slits</tspan></text>
    <text x="44" y="276" fill="#4ade80" font-family="monospace" font-size="12">Lap Completion: <tspan fill="#f1f5f9">2m 14s (Fastest Run)</tspan></text>
    <text x="44" y="302" fill="#4ade80" font-family="monospace" font-size="12">Autonomy Level: <tspan fill="#f1f5f9">Zero Human Teleop</tspan></text>
    <text x="44" y="328" fill="#38bdf8" font-family="monospace" font-size="12">System Uptime: <tspan fill="#f1f5f9">100% under competition</tspan></text>

  <!-- Right Visual / Graph Pane -->
  <rect x="264" y="92" width="508" height="338" rx="6" fill="#0a0d13" stroke="#192231"/>
  <rect x="264" y="92" width="508" height="28" rx="6" fill="#111622"/>
  <text x="278" y="110" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">ARENA TRAJECTORY &amp; REAL-TIME LIDAR OBSTACLE MAP</text>
  
  <!-- Right Content Injected -->
  <!-- Rover Arena Simulation -->
  <rect x="290" y="140" width="455" height="170" rx="4" fill="#0b0e14" stroke="#161e2e"/>
  
  <!-- Arena Track -->
  <path d="M 310,280 L 420,180 L 530,260 L 640,160 L 710,210" fill="none" stroke="url(#emeraldLine)" stroke-width="3"/>
  <circle cx="710" cy="210" r="6" fill="#fbbf24"/>
  <text x="630" y="235" fill="#fbbf24" font-family="monospace" font-size="10">Rover Finish Line</text>

  <!-- Obstacle Markers -->
  <rect x="410" y="170" width="16" height="16" fill="#f87171" rx="2"/>
  <rect x="520" y="250" width="16" height="16" fill="#f87171" rx="2"/>
  <rect x="630" y="150" width="16" height="16" fill="#f87171" rx="2"/>
  <text x="310" y="160" fill="#38bdf8" font-family="monospace" font-size="10">3D LiDAR Point Cloud Mesh Ingested: 24,000 pts/sec</text>

  <!-- Status Bar Footer in Right Pane -->
  <rect x="278" y="380" width="480" height="36" rx="4" fill="#0e131d" stroke="#192231"/>
  <text x="292" y="398" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">✓ Hardware build verified under intense competition arena conditions</text>
  <text x="292" y="411" fill="#64748b" font-family="monospace" font-size="10">IIT Bombay Techfest National Runner-up · Autonomous edge robotics hardware</text>
</svg>